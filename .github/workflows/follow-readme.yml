# Keeps landing/README.md the same as the README of the ImmersiveMap
# repository, so the landing page follows it without anyone touching it.
#
# Once an hour the file is fetched and compared with the copy here. When it
# differs, the new one is committed and pushed. That push is a push to main
# like any other, so Cloudflare (which is connected to this repository and
# builds on every push) renders and publishes the site; nothing here deploys.
#
# No secrets: the README is public, and the workflow's own token can push to
# the repository it runs in.
name: Follow the README

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: follow-readme
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPO: artembobkin/ImmersiveMap
  SOURCE_BRANCH: main

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the README
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$SOURCE_REPO/$SOURCE_BRANCH/README.md" -o landing/README.md
          # A README that came back empty is a failed fetch, whatever curl said.
          test -s landing/README.md

      - name: Commit it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- landing/README.md; then
            echo "landing/README.md is already the README at $SOURCE_REPO@$SOURCE_BRANCH"
            exit 0
          fi
          # Name the commit after the one that changed the README over there.
          rev=$(gh api "repos/$SOURCE_REPO/commits?sha=$SOURCE_BRANCH&path=README.md&per_page=1" \
                --jq '.[0] | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"' || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing/README.md
          git commit -m "Follow the README: ${rev:-latest}" \
                     -m "Copied from https://github.com/$SOURCE_REPO/blob/$SOURCE_BRANCH/README.md by the follow-readme workflow."
          git push
