# Keeps landing/README.md and documentation/ the same as the README and the
# Documentation folder of the ImmersiveMap repository, so the landing page and
# the documentation pages follow them without anyone touching them.
#
# A push to either over there starts this at once: the notify-website workflow
# in that repository sends the repository_dispatch event below. The hourly run
# is the backstop for a notification that never arrived. Each run fetches both,
# compares them with the copies here, and commits and pushes whatever differs.
# That push is a push to main like any other, so Cloudflare (which is connected
# to this repository and builds on every push) renders and publishes the site;
# nothing here deploys.
#
# No secrets here: both are public, and the workflow's own token can push to
# the repository it runs in.
name: Follow the README and the documentation

on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [immersivemap-pushed]
  workflow_dispatch:

concurrency:
  group: follow-readme
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPO: artembobkin/ImmersiveMap
  SOURCE_BRANCH: main

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # From the archive of the branch rather than raw.githubusercontent.com:
      # the raw host caches for minutes, so a run started by a push would read
      # the old file, see no difference and stop.
      - name: Fetch the README and the documentation
        run: |
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/$SOURCE_REPO/archive/refs/heads/$SOURCE_BRANCH.tar.gz" | tar -xz -C "$tmp" --strip-components=1
          # An empty README or no pages at all is a failed fetch, whatever curl
          # said, and must not touch the copies.
          test -s "$tmp/README.md"
          ls "$tmp"/Documentation/*.md > /dev/null
          cp "$tmp/README.md" landing/README.md
          # Replaced whole, so a page deleted or renamed over there goes here too.
          rm -rf documentation
          mkdir documentation
          cp "$tmp"/Documentation/*.md documentation/

      - name: Commit what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # follow <path here> <path over there> <what to call it>
          follow() {
            if [ -z "$(git status --porcelain -- "$1")" ]; then
              echo "$1 is already $2 at $SOURCE_REPO@$SOURCE_BRANCH"
              return 0
            fi
            # Name the commit after the one that changed it over there.
            rev=$(gh api "repos/$SOURCE_REPO/commits?sha=$SOURCE_BRANCH&path=$2&per_page=1" \
                  --jq '.[0] | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"' || true)
            git add -A -- "$1"
            git commit -m "Follow $3: ${rev:-latest}" \
                       -m "Copied from https://github.com/$SOURCE_REPO/blob/$SOURCE_BRANCH/$2 by the follow-readme workflow."
          }

          follow landing/README.md README.md "the README"
          follow documentation Documentation "the documentation"
          git push
